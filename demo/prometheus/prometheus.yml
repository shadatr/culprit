global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  # Every app series already carries a constant `service` label set by the
  # binary itself, so no relabelling is needed here.
  - job_name: shop
    static_configs:
      - targets: ["frontend:8080", "catalog:8080", "cart:8080"]
