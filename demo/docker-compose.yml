# Culprit demo shop: three Go services, load generator, Postgres, Redis,
# Prometheus and Loki. Grafana is optional: `docker compose --profile grafana up`.
#
# Chaos scenarios change behaviour through the variables below (see ./chaos):
#   CATALOG_VERSION / CATALOG_FAULT       catalog release and fault switch
#   FRONTEND_VERSION / FRONTEND_FAULT     frontend release and fault switch
#   FRONTEND_CATALOG_TIMEOUT              frontend -> catalog client timeout
name: culprit-demo

x-app: &app
  build:
    context: ./app
  image: culprit-demo-app:local
  restart: unless-stopped
  read_only: true
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 10s

x-app-env: &app-env
  ADDR: ":8080"
  LOKI_URL: http://loki:3100
  # Local demo token for POST /admin/fault; not a secret.
  ADMIN_TOKEN: ${DEMO_ADMIN_TOKEN:-demo-admin-token}

services:
  postgres:
    image: postgres:16.15-alpine3.23
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["127.0.0.1:${DEMO_POSTGRES_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4.11-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["127.0.0.1:${DEMO_REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  catalog:
    <<: *app
    command: ["-role", "catalog"]
    environment:
      <<: *app-env
      APP_VERSION: ${CATALOG_VERSION:-1.8.1}
      FAULT: ${CATALOG_FAULT:-}
      DATABASE_URL: postgres://shop:shop@postgres:5432/shop?sslmode=disable
      DB_MAX_CONNS: "10"
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      loki: { condition: service_started }

  cart:
    <<: *app
    command: ["-role", "cart"]
    environment:
      <<: *app-env
      APP_VERSION: ${CART_VERSION:-2.3.0}
      REDIS_ADDR: redis:6379
    ports: ["127.0.0.1:8082:8080"]
    depends_on:
      redis: { condition: service_healthy }
      loki: { condition: service_started }
    # cart does not exit when redis disappears: it keeps serving and answers
    # 503, which is what the redis-down scenario relies on.

  frontend:
    <<: *app
    command: ["-role", "frontend"]
    environment:
      <<: *app-env
      APP_VERSION: ${FRONTEND_VERSION:-4.12.0}
      FAULT: ${FRONTEND_FAULT:-}
      CATALOG_URL: http://catalog:8080
      CART_URL: http://cart:8080
      CATALOG_TIMEOUT: ${FRONTEND_CATALOG_TIMEOUT:-2s}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      catalog: { condition: service_healthy }
      cart: { condition: service_healthy }

  loadgen:
    <<: *app
    command: ["-role", "loadgen"]
    environment:
      TARGET_URL: http://frontend:8080
      RPS: ${LOADGEN_RPS:-12}
    healthcheck:
      disable: true
    depends_on:
      frontend: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=12h
      - --web.listen-address=:9090
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - lokidata:/loki
    ports: ["127.0.0.1:3100:3100"]
    # The Loki image ships no shell or HTTP client, so readiness is checked
    # from the host by `make up` (curl /ready) rather than a healthcheck.
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["grafana"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  promdata:
  lokidata:
